name: Cross-platform Python checkers

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checker-contract:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
        python-version:
          - "3.10"
          - "3.x"

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile canonical scripts and tests
        run: python -m compileall -q scripts tests

      - name: Run native checker contract
        run: >-
          python -m unittest
          tests.test_python_checker_contract
          tests.test_root_agents_blocks
          tests.test_onboarding_core_flow_coverage
          tests.test_concept_foundation_trace
          tests.test_adr_requirement_model_trace
          tests.test_feature_archive_support
          tests.test_feature_monthly_archive_scan
          tests.test_feature_monthly_archive_apply
          tests.test_feature_monthly_archive_restore
          tests.test_memory_reconciliation_support
          tests.test_memory_reconciliation_scan
          tests.test_memory_reconciliation_check
          tests.test_memory_reconciliation_apply
          tests.test_memory_reconciliation_restore
          tests.test_lightweight_change_scan
          -v

      - name: Check Feature Monthly Archive command entrypoints
        run: |
          python scripts/scan-feature-monthly-archive.py --help
          python scripts/check-feature-monthly-archive.py --help
          python scripts/apply-feature-monthly-archive.py --help
          python scripts/restore-feature-monthly-archive.py --help

      - name: Check Post-Merge Memory Reconciliation command entrypoints
        run: |
          python scripts/scan-memory-reconciliation.py --help
          python scripts/check-memory-reconciliation.py --help
          python scripts/apply-memory-reconciliation.py --help
          python scripts/restore-memory-reconciliation.py --help

      - name: Check Lightweight Change command entrypoint
        run: python scripts/scan-lightweight-changes.py --help
